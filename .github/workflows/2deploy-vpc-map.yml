name: 2-Deploy VPC-CLOUD-MAP Infra

on:
  workflow_dispatch:
 
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3  # Atualização para a versão mais recente

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3  # Atualização para a versão mais recente
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 

      - name: Deploy Stack (cria ou atualiza)
        run: |
          aws cloudformation deploy \
            --stack-name estudo-vpc-map \
            --template-file ./cloudformation/environment/FARGATE/vpc/estudo-vpc-map.json \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset
